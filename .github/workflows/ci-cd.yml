name: CI/CD Pipeline with GCR + Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # required for semantic-release

      # 2. Setup Node.js and pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 3. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Run tests
      - name: Run tests
        run: pnpm test:ci
        env:
          CI: true

      # 5. Build the application
      - name: Build application
        run: pnpm build

      # 6. Run semantic-release to calculate next version
      - name: Run semantic-release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Authenticate to GCP (only if secrets are available)
      - name: Authenticate to GCP
        # if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        # if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        run: gcloud auth configure-docker gcr.io --quiet

      # 8. Build & push frontend (only if secrets are available)
      - name: Build & Push Frontend
        # if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/ui-post-factory:${{ github.sha }}
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/ui-post-factory:v${{ steps.semantic.outputs.new_release_version }}
