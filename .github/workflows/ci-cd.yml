name: CI/CD Pipeline with GCR + Semantic Release

on:
  push:
    branches:
      - main

jobs:
  release-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # required for semantic-release

      # 2. Setup Node.js and pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 3. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Run tests
      - name: Run tests
        run: pnpm test --coverage --watchAll=false

      # 5. Build the application
      - name: Build application
        run: pnpm build

      # 6. Run semantic-release to calculate next version
      - name: Run semantic-release
        id: semantic
        run: |
          pnpm add --save-dev semantic-release @semantic-release/git @semantic-release/github
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      # # 9. Build & push backend1
      # - name: Build & Push Backend1
      #   uses: docker/build-push-action@v4
      #   with:
      #     context: ./backend1
      #     push: true
      #     tags: |
      #       gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend1:${{ github.sha }}
      #       gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend1:v${{ steps.semantic.outputs.new_release_version }}

      # # 10. Build & push backend2
      # - name: Build & Push Backend2
      #   uses: docker/build-push-action@v4
      #   with:
      #     context: ./backend2
      #     push: true
      #     tags: |
      #       gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend2:${{ github.sha }}
      #       gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend2:v${{ steps.semantic.outputs.new_release_version }}

      # 8. Build & push frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/ui-post-factory:${{ github.sha }}
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/ui-post-factory:v${{ steps.semantic.outputs.new_release_version }}
